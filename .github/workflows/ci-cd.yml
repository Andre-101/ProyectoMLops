name: CI/CD - Generic Inference App

on:
  push:
    branches: [ "dev", "prod" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-inference

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-inference
      DEV_TEST_DATA_URL: ${{ vars.DEV_TEST_DATA_URL }}
      PROD_TEST_DATA_URL: ${{ vars.PROD_TEST_DATA_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Set model config for this branch
        run: |
          BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          if [ "$BRANCH" = "dev" ]; then
            echo "MODEL_ID=protectai/bert-base-NER-onnx" >> $GITHUB_ENV
            echo "MODEL_TASK=ner" >> $GITHUB_ENV
            echo "MODEL_CLASS=optimum.onnxruntime.ORTModelForTokenClassification" >> $GITHUB_ENV
            echo "TOKENIZER_ID=dslim/bert-base-NER" >> $GITHUB_ENV
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          else
            echo "MODEL_ID=Xenova/bart-large-mnli" >> $GITHUB_ENV
            echo "MODEL_TASK=zero-shot-classification" >> $GITHUB_ENV
            echo "MODEL_CLASS=optimum.onnxruntime.ORTModelForSequenceClassification" >> $GITHUB_ENV
            echo "TOKENIZER_ID=facebook/bart-large-mnli" >> $GITHUB_ENV
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          fi

      - name: Download test data from bucket (GitHub Release)
        run: |
          mkdir -p tests_data
          BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          if [ "$BRANCH" = "dev" ]; then
            URL="$DEV_TEST_DATA_URL"
          else
            URL="$PROD_TEST_DATA_URL"
          fi
          echo "Downloading test data for branch $BRANCH"
          wget -O tests_data/test_data.json "$URL"
      - name: Run tests
        env:
          TEST_DATA_PATH: ${{ github.workspace }}/tests_data/test_data.json
        run: |
          python -m pytest -q

  # ------------------------------------------------------------------

  build-and-deploy:
    needs: test
    runs-on: self-hosted
    permissions:
        contents: read
        packages: write

    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set image tag
          run: |
            $branch = "${{ github.ref_name }}"
            Write-Host "Branch: $branch"
            "IMAGE_TAG=$branch" >> $env:GITHUB_ENV

        - name: Login to GHCR
          run: |
            $token = "${{ secrets.GHCR_PAT }}"
            $token | docker login $env:REGISTRY -u "${{ github.actor }}" --password-stdin

        - name: Build image
          run: |
            $image = "$env:REGISTRY/$env:IMAGE_NAME:$env:IMAGE_TAG"
            Write-Host "Building image $image"
            docker build -t $image .

        - name: Push image
          run: |
            $image = "$env:REGISTRY/$env:IMAGE_NAME:$env:IMAGE_TAG"
            Write-Host "Pushing image $image"
            docker push $image

        - name: Update services with docker compose
          run: |
            docker compose pull
            docker compose up -d
