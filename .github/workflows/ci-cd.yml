name: CI/CD - Generic Inference App

on:
  push:
    branches: [ "dev", "prod" ]
  workflow_dispatch:

env:
  IMAGE_NAME: proyectomlops-inference   # solo el nombre; el usuario va en los tags

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-inference
      DEV_TEST_DATA_URL: ${{ vars.DEV_TEST_DATA_URL }}
      PROD_TEST_DATA_URL: ${{ vars.PROD_TEST_DATA_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Set model config for this branch
        run: |
          BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          if [ "$BRANCH" = "dev" ]; then
            echo "MODEL_ID=protectai/bert-base-NER-onnx" >> $GITHUB_ENV
            echo "MODEL_TASK=ner" >> $GITHUB_ENV
            echo "MODEL_CLASS=optimum.onnxruntime.ORTModelForTokenClassification" >> $GITHUB_ENV
            echo "TOKENIZER_ID=dslim/bert-base-NER" >> $GITHUB_ENV
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          else
            echo "MODEL_ID=Xenova/bart-large-mnli" >> $GITHUB_ENV
            echo "MODEL_TASK=zero-shot-classification" >> $GITHUB_ENV
            echo "MODEL_CLASS=optimum.onnxruntime.ORTModelForSequenceClassification" >> $GITHUB_ENV
            echo "TOKENIZER_ID=facebook/bart-large-mnli" >> $GITHUB_ENV
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          fi

      - name: Download test data from bucket
        run: |
          mkdir -p tests_data
          BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          if [ "$BRANCH" = "dev" ]; then
            URL="$DEV_TEST_DATA_URL"
          else
            URL="$PROD_TEST_DATA_URL"
          fi
          echo "Downloading test data for branch $BRANCH"
          wget -O tests_data/test_data.json "$URL"

      - name: Run tests
        env:
          TEST_DATA_PATH: ${{ github.workspace }}/tests_data/test_data.json
        run: |
          python -m pytest -q

  # ------------------------------------------------------------------

  build-and-push:
    needs: test
    runs-on: ubuntu-latest   # 👈 ya no usamos self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
